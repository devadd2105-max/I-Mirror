plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devadd.imirror'
    compileSdk 34

    defaultConfig {
        applicationId 'com.devadd.imirror'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Only used to make the self-signed certificate; the protocol and server are plain Java in core/.
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
